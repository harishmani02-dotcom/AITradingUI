name: aitradingui
description: AI Trading UI Flutter application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Backend & Database
  supabase_flutter: ^2.0.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  
  # HTTP & Network
  http: ^1.1.0
  url_launcher: ^6.2.1
  
  # RSS Feed Parser
  webfeed: ^0.7.0
  
  # AI Integration
  google_generative_ai: ^0.2.0
  
  # Payment Gateway
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Add your assets here
  assets:
    - .env
    - assets/icons/
