name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Verify secrets are set
      run: |
        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "ERROR: SUPABASE_URL secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "ERROR: SUPABASE_ANON_KEY secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "ERROR: GEMINI_API_KEY secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "ERROR: KEYSTORE_BASE64 secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
          echo "ERROR: KEYSTORE_PASSWORD secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
          echo "ERROR: KEY_ALIAS secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "ERROR: KEY_PASSWORD secret is not set!"
          exit 1
        fi
        echo "✅ All secrets are set"

    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "✅ .env file created"
       
    - name: Verify .env file
      run: |
        if [ ! -f .env ]; then
          echo "ERROR: .env file was not created!"
          exit 1
        fi
        echo "✅ .env file exists"
        echo "File size: $(wc -c < .env) bytes"
        if [ $(wc -c < .env) -lt 100 ]; then
          echo "WARNING: .env file seems too small (less than 100 bytes)!"
          echo "This might indicate empty secret values."
        fi
        # Verify structure without revealing secrets
        if grep -q "SUPABASE_URL=https://" .env; then
          echo "✅ SUPABASE_URL has correct format"
        else
          echo "ERROR: SUPABASE_URL is missing or malformed!"
          exit 1
        fi
        if grep -q "SUPABASE_ANON_KEY=eyJ" .env; then
          echo "✅ SUPABASE_ANON_KEY has correct format"
        else
          echo "ERROR: SUPABASE_ANON_KEY is missing or malformed!"
          exit 1
        fi
        if grep -q "GEMINI_API_KEY=AIza" .env; then
          echo "✅ GEMINI_API_KEY has correct format"
        else
          echo "ERROR: GEMINI_API_KEY is missing or malformed!"
          exit 1
        fi

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        if [ ! -f android/app/upload-keystore.jks ]; then
          echo "ERROR: Keystore file was not created!"
          exit 1
        fi
        echo "✅ Keystore decoded successfully"

    - name: Create keystore.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
        echo "storeFile=app/upload-keystore.jks" >> android/keystore.properties
        echo "✅ keystore.properties created"

    - name: Verify keystore.properties
      run: |
        if [ ! -f android/keystore.properties ]; then
          echo "ERROR: keystore.properties was not created!"
          exit 1
        fi
        echo "✅ keystore.properties exists"

    - name: Clean and get dependencies
      run: |
        flutter clean
        flutter pub get
        echo "✅ Dependencies installed"
   
    - name: Generate app icons
      run: |
        echo "Generating launcher icons..."
        dart run flutter_launcher_icons
        echo "✅ Icons generated"

    - name: Debug keystore setup
      run: |
        echo "=== Checking keystore.properties ==="
        cat android/keystore.properties
        echo ""
        echo "=== Checking if keystore file exists ==="
        ls -la android/app/upload-keystore.jks || echo "Keystore file NOT found!"
        echo ""
        echo "=== Checking android directory ==="
        ls -la android/

    - name: Build APK
      run: |
        echo "Starting APK build..."
        flutter build apk --release --verbose 2>&1 | tee build_log.txt
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "========================================"
          echo "BUILD FAILED - Showing relevant errors:"
          echo "========================================"
          grep -B 5 -A 10 "FAILURE\|ERROR\|Exception\|What went wrong" build_log.txt || tail -100 build_log.txt
          echo "========================================"
          echo "Checking for common issues..."
          echo "========================================"
          if grep -q "Cannot convert URL" build_log.txt; then
            echo "❌ ERROR: Keystore path issue detected"
            echo "Contents of keystore.properties:"
            cat android/keystore.properties
          fi
          if grep -q "keystore" build_log.txt; then
            echo "❌ ERROR: Keystore-related issue"
            ls -la android/app/ | grep keystore || echo "No keystore files found"
          fi
          exit $BUILD_EXIT_CODE
        fi
        echo "✅ APK built successfully"

    - name: Verify APK was created
      run: |
        if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
          echo "ERROR: APK file was not created!"
          exit 1
        fi
        echo "✅ APK file exists"
        ls -lh build/app/outputs/flutter-apk/app-release.apk

    - name: Verify APK includes .env
      run: |
        echo "=== Checking if .env is bundled in APK ==="
        unzip -l build/app/outputs/flutter-apk/app-release.apk | grep "flutter_assets" | grep ".env" || echo "WARNING: .env might not be in APK!"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Build AAB
      run: |
        flutter build appbundle --release
        echo "✅ AAB built successfully"

    - name: Verify AAB was created
      run: |
        if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
          echo "ERROR: AAB file was not created!"
          exit 1
        fi
        echo "✅ AAB file exists"
        ls -lh build/app/outputs/bundle/release/app-release.aab

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
