name: Build Android APK
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-latest
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
 
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
 
    - name: Verify secrets are set
      run: |
        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "ERROR: SUPABASE_URL secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "ERROR: SUPABASE_ANON_KEY secret is not set!"
          exit 1
        fi
        echo "✓ Both secrets are set"
 
    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        echo "✓ .env file created"
       
    - name: Verify .env file
      run: |
        if [ ! -f .env ]; then
          echo "ERROR: .env file was not created!"
          exit 1
        fi
        echo "✓ .env file exists"
        echo "File size: $(wc -c < .env) bytes"
        if [ $(wc -c < .env) -lt 100 ]; then
          echo "WARNING: .env file seems too small (less than 100 bytes)!"
        fi
        if grep -q "SUPABASE_URL=https://" .env; then
          echo "✓ SUPABASE_URL has correct format"
        else
          echo "ERROR: SUPABASE_URL is missing or malformed!"
          exit 1
        fi
        if grep -q "SUPABASE_ANON_KEY=eyJ" .env; then
          echo "✓ SUPABASE_ANON_KEY has correct format"
        else
          echo "ERROR: SUPABASE_ANON_KEY is missing or malformed!"
          exit 1
        fi
 
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        echo "✓ Keystore decoded"
        ls -lh android/app/upload-keystore.jks
 
    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=upload-keystore.jks" >> android/key.properties
        echo "✓ key.properties created"

    - name: Configure Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
        echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
        echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
 
    - name: Clean and get dependencies
      run: |
        flutter clean
        flutter pub get
   
    - name: Generate app icons
      run: |
        echo "Generating launcher icons..."
        dart run flutter_launcher_icons
        echo "✓ Icons generated"

    - name: Analyze Gradle configuration
      run: |
        cd android
        ./gradlew --version
        echo "=== Gradle Wrapper Properties ==="
        cat gradle/wrapper/gradle-wrapper.properties
 
    - name: Build APK
      run: |
        flutter build apk --release --verbose 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      continue-on-error: true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
 
    - name: Verify APK was created
      run: |
        if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
          echo "✓ APK created successfully"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
        else
          echo "ERROR: APK was not created!"
          exit 1
        fi
 
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
 
    - name: Build AAB
      if: success()
      run: flutter build appbundle --release
 
    - name: Upload AAB
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
