name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (pin exact version)
        uses: flutter-actions/setup-flutter@v2
        with:
          version: '3.35.7'   # ✅ correct key is 'version', not 'flutter-version'

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version

      # 🔥 NEW STEP - Create .env file from GitHub Secret
      - name: Create .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo ".env file created successfully"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Run tests if present
        run: |
          if [ -d test ] && [ "$(ls -A test)" ]; then
            echo "Running tests..."
            flutter test
          else
            echo "No tests found in test/ — skipping flutter test"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_trading_signals-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
