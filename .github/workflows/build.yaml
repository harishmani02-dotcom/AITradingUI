name: Android Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------
    # Checkout Project
    # -----------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -----------------------------
    # Java 17 Required for Android
    # -----------------------------
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "17"

    # -----------------------------
    # Install Flutter
    # -----------------------------
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.24.0"
        channel: "stable"

    # -----------------------------
    # Validate Required Secrets
    # -----------------------------
    - name: Verify Secrets
      run: |
        [ -n "${{ secrets.SUPABASE_URL }}" ] || (echo "❌ SUPABASE_URL missing" && exit 1)
        [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ] || (echo "❌ SUPABASE_ANON_KEY missing" && exit 1)
        [ -n "${{ secrets.GEMINI_API_KEY }}" ] || (echo "❌ GEMINI_API_KEY missing" && exit 1)
        [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || (echo "❌ KEYSTORE_BASE64 missing" && exit 1)
        [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] || (echo "❌ KEYSTORE_PASSWORD missing" && exit 1)
        [ -n "${{ secrets.KEY_ALIAS }}" ] || (echo "❌ KEY_ALIAS missing" && exit 1)
        [ -n "${{ secrets.KEY_PASSWORD }}" ] || (echo "❌ KEY_PASSWORD missing" && exit 1)
        echo "✅ All Secrets Present"

    # -----------------------------
    # Create .env
    # -----------------------------
    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "✓ .env created"

    # -----------------------------
    # Keystore Setup
    # -----------------------------
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=upload-keystore.jks" >> android/key.properties
        cat android/key.properties

    # -----------------------------
    # Flutter Dependencies + Icons
    # -----------------------------
    - name: Install packages
      run: |
        flutter clean
        flutter pub get

    - name: Generate Icons
      run: dart run flutter_launcher_icons || echo "⚠ Icons not configured – ignoring"

    # -----------------------------
    # Build APK
    # -----------------------------
    - name: Build APK
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

    # -----------------------------
    # Build AAB
    # -----------------------------
    - name: Build AAB
      run: flutter build appbundle --release

    # -----------------------------
    # Upload Artifacts
    # -----------------------------
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
