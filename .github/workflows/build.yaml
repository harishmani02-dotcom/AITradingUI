name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Clear Gradle Cache
      run: |
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/wrapper/

    - name: Replace Android Build Files
      run: |
        rm -f android/app/build.gradle
        rm -f android/app/build.gradle.kts
        
        cat > android/settings.gradle.kts << 'SETTINGSEOF'
        pluginManagement {
            val flutterSdkPath = run {
                val properties = java.util.Properties()
                file("local.properties").inputStream().use { properties.load(it) }
                properties.getProperty("flutter.sdk") ?: throw GradleException("flutter.sdk not set")
            }
            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        plugins {
            id("dev.flutter.flutter-plugin-loader") version "1.0.0"
            id("com.android.application") version "8.3.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        include(":app")
        SETTINGSEOF
        
        cat > android/build.gradle.kts << 'BUILDEOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath("com.android.tools.build:gradle:8.3.0")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        tasks.register<Delete>("clean") {
            delete(rootProject.layout.buildDirectory)
        }
        BUILDEOF
        
        cat > android/app/build.gradle.kts << 'APPEOF'
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }
        
        android {
            namespace = "com.finspark.ai"
            compileSdk = 34
            
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            
            kotlinOptions {
                jvmTarget = "17"
            }
            
            defaultConfig {
                applicationId = "com.finspark.ai"
                minSdk = 21
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
                multiDexEnabled = true
            }
            
            signingConfigs {
                create("release") {
                    storeFile = file("upload-keystore.jks")
                    storePassword = System.getenv("KEYSTORE_PASSWORD")
                    keyAlias = System.getenv("KEY_ALIAS")
                    keyPassword = System.getenv("KEY_PASSWORD")
                }
            }
            
            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("release")
                    isMinifyEnabled = false
                    isShrinkResources = false
                }
            }
        }
        
        flutter {
            source = "../.."
        }
        
        dependencies {
            implementation("androidx.multidex:multidex:2.0.1")
        }
        APPEOF
        
        cat > android/gradle.properties << 'PROPEOF'
        org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.version=1.9.24
        android.defaults.buildfeatures.buildconfig=true
        android.nonTransitiveRClass=false
        PROPEOF

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Create .env file
      run: |
        cat > .env << EOF
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        EOF

    - name: Get Dependencies
      run: flutter pub get

    - name: Run Flutter Doctor
      run: flutter doctor -v

    - name: Build APK
      run: flutter build apk --release --verbose
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Verify APK Build
      run: |
        APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK built successfully"
          echo "APK Size: $(du -h $APK_PATH | cut -f1)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
        else
          echo "❌ APK not found at $APK_PATH"
          echo "Searching for APK files..."
          find build -name "*.apk" -type f
          exit 1
        fi

    - name: Build AAB
      run: flutter build appbundle --release --verbose
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Verify AAB Build
      run: |
        AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
        if [ -f "$AAB_PATH" ]; then
          echo "✅ AAB built successfully"
          echo "AAB Size: $(du -h $AAB_PATH | cut -f1)"
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_ENV
        else
          echo "❌ AAB not found at $AAB_PATH"
          echo "Searching for AAB files..."
          find build -name "*.aab" -type f
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Summary ==="
        echo ""
        if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
          echo "✅ APK: $(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}')"
        else
          echo "❌ APK build failed"
        fi
        
        if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
          echo "✅ AAB: $(ls -lh build/app/outputs/bundle/release/app-release.aab | awk '{print $5}')"
        else
          echo "❌ AAB build failed"
        fi
