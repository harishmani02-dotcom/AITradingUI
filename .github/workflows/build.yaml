name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Verify Secrets
      run: |
        echo "Checking secrets..."
        [ -z "${{ secrets.GEMINI_API_KEY }}" ] && echo "Missing GEMINI_API_KEY" && exit 1
        [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && echo "Missing KEYSTORE_BASE64" && exit 1
        [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && echo "Missing KEYSTORE_PASSWORD" && exit 1
        [ -z "${{ secrets.KEY_ALIAS }}" ] && echo "Missing KEY_ALIAS" && exit 1
        [ -z "${{ secrets.KEY_PASSWORD }}" ] && echo "Missing KEY_PASSWORD" && exit 1
        echo "All secrets configured"

    - name: Update settings.gradle.kts
      run: |
        cat > android/settings.gradle.kts << 'GRADLE_EOF'
        pluginManagement {
            val flutterSdkPath = run {
                val properties = java.util.Properties()
                file("local.properties").inputStream().use { properties.load(it) }
                properties.getProperty("flutter.sdk")
                    ?: throw GradleException("Flutter SDK not found in local.properties")
            }

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id("dev.flutter.flutter-plugin-loader") version "1.0.0"
            id("com.android.application") version "7.4.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }

        include(":app")
        GRADLE_EOF

    - name: Update build.gradle.kts
      run: |
        cat > android/build.gradle.kts << 'GRADLE_EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath("com.android.tools.build:gradle:7.4.2")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        tasks.register("clean", Delete::class) {
            delete(rootProject.buildDir)
        }
        GRADLE_EOF

    - name: Update app/build.gradle.kts
      run: |
        cat > android/app/build.gradle.kts << 'GRADLE_EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.finspark.ai"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.finspark.ai"
                minSdk = 21
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            signingConfigs {
                create("release") {
                    storeFile = file("upload-keystore.jks")
                    storePassword = System.getenv("KEYSTORE_PASSWORD")
                    keyAlias = System.getenv("KEY_ALIAS")
                    keyPassword = System.getenv("KEY_PASSWORD")
                }
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("release")
                }
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        flutter {
            source = "../.."
        }
        GRADLE_EOF

    - name: Update gradle.properties
      run: |
        cat > android/gradle.properties << 'GRADLE_EOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        android.nonTransitiveRClass=false
        android.defaults.buildfeatures.buildconfig=true
        android.nonFinalResIds=false
        GRADLE_EOF

    - name: Update gradle-wrapper.properties
      run: |
        cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLE_EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.4-all.zip
        GRADLE_EOF

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Create .env file
      run: |
        touch .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo ".env file created"

    - name: Get Dependencies
      run: flutter pub get

    - name: Clean Build
      run: flutter clean

    - name: Build APK
      run: |
        flutter build apk --release \
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Build AAB
      run: |
        flutter build appbundle --release \
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
