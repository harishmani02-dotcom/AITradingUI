name: Build Android APK
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-latest
   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
 
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
 
    - name: Create .env file
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        echo "Created .env file"
        ls -la .env
 
    - name: Verify .env content (without exposing secrets)
      run: |
        if [ -f .env ]; then
          echo ".env file exists"
          echo "Number of lines: $(wc -l < .env)"
          # Check if variables are set (without showing values)
          grep -q "SUPABASE_URL=" .env && echo "✓ SUPABASE_URL is set" || echo "✗ SUPABASE_URL is missing"
          grep -q "SUPABASE_ANON_KEY=" .env && echo "✓ SUPABASE_ANON_KEY is set" || echo "✗ SUPABASE_ANON_KEY is missing"
        else
          echo "ERROR: .env file not created!"
          exit 1
        fi
 
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
 
    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=upload-keystore.jks" >> android/key.properties
 
    - name: Clean and get dependencies
      run: |
        flutter clean
        flutter pub get
 
    - name: Verify assets in pubspec.yaml
      run: |
        echo "Checking pubspec.yaml assets configuration:"
        grep -A 5 "assets:" pubspec.yaml || echo "No assets section found!"
 
    - name: Build APK
      run: flutter build apk --release --verbose
 
    - name: Verify APK
      run: |
        ls -lh build/app/outputs/flutter-apk/app-release.apk
        # Extract and check if .env is in the APK
        unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "\.env\|assets" || echo "Checking APK contents..."
 
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
 
    - name: Build AAB
      run: flutter build appbundle --release
 
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: build/app/outputs/bundle/release/app-release.aab
